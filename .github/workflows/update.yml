name: 도서관 대출 현황 갱신

on:
  schedule:
    # GitHub 무료 예약 실행은 몇 시간씩 늦거나 가끔 건너뛰어서, 여러 시각에 걸어 둡니다 (여러 번 돌아도 문제없음).
    # 한국시간 05:17 / 05:47 / 06:17 / 06:47 (정각은 GitHub 가 가장 붐벼서 피함)
    - cron: '17 20 * * *'
    - cron: '47 20 * * *'
    - cron: '17 21 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch: # Actions 탭에서 "Run workflow" 로 바로 실행
    inputs:
      extend:
        description: '연장 가능한 책 반납연기 신청'
        type: boolean
        default: true
  push: # 코드(디자인 등)를 고쳐서 올리면 바로 반영
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --omit=optional --no-audit --no-fund

      - name: 대출 현황 가져오기 + 잠긴 페이지 만들기
        env:
          SNLIB_ID: ${{ secrets.SNLIB_ID }}
          SNLIB_PW: ${{ secrets.SNLIB_PW }}
          SNLIB_NAME: ${{ secrets.SNLIB_NAME }}
          SNLIB_ACCOUNTS: ${{ secrets.SNLIB_ACCOUNTS }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
          # 예약 실행과 직접 실행(Run workflow)일 때 연장 가능한 책을 반납연기 신청합니다. 코드 수정(push) 때는 보기만.
          AUTO_EXTEND: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extend)) && 'true' || 'false' }}
        run: node fetch-loans.js --no-open

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub 는 60일 동안 저장소에 변화가 없으면 예약 실행을 멈춥니다. 50일마다 빈 커밋으로 깨워 둡니다.
      - name: 예약 실행 유지
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50*24*3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
